<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@mapper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup" id="popup">
      <header class="header">
        <h1 class="title"><span class="title__trigger" id="appTrigger">@</span><span id="appTitle">mapper</span> <span class="title__example" aria-hidden="true">→ yey c:</span></h1>
        <div class="header-actions">
          <span class="host-badge" id="hostBadge"></span>
          <button class="ui-button ui-button--ghost ui-button--compact theme-toggle" id="themeToggle" type="button" title="Change theme" aria-label="Change theme">Theme</button>
        </div>
      </header>

      <section class="site-section" id="siteSection">
        <label class="ui-switch ui-switch--compact" for="siteToggleInput">
          <input id="siteToggleInput" type="checkbox" aria-labelledby="siteToggleLabel" aria-describedby="siteStatus" />
          <span class="ui-switch__track" aria-hidden="true"></span>
        </label>
        <div class="site-info">
          <span class="site-info__label" id="siteToggleLabel"></span>
          <span class="site-info__status" id="siteStatus"></span>
        </div>
      </section>

      <section class="add-section">
        <div class="field-row add-row">
          <div class="ui-field grow">
            <label class="ui-visually-hidden" for="newKey">Shortcut</label>
            <input class="ui-input ui-input--compact" id="newKey" type="text" placeholder="@word" autocomplete="off" />
          </div>
          <span class="arrow" aria-hidden="true">→</span>
          <div class="ui-field grow">
            <label class="ui-visually-hidden" for="newVal">Replacement text</label>
            <input class="ui-input ui-input--compact" id="newVal" type="text" placeholder="replacement" autocomplete="off" />
          </div>
          <button class="ui-button ui-button--primary ui-button--compact" id="addBtn" type="button">Add</button>
        </div>
      </section>

      <section class="search-section">
        <div class="search-wrap">
          <label class="ui-visually-hidden" for="searchInput">Search mappings</label>
          <input
            id="searchInput"
            class="ui-input ui-input--compact search"
            type="text"
            placeholder="Search mappings…"
            autocomplete="off"
          />
          <span class="count" id="mappingCount"></span>
        </div>
      </section>

      <section class="list-section">
        <ul class="ui-list mappings" id="mappingsList"></ul>
        <div class="ui-empty-state ui-empty-state--compact empty" id="emptyState"></div>
      </section>

      <section class="actions">
        <button class="ui-button ui-button--secondary ui-button--compact" id="exportBtn" type="button">Export</button>
        <button class="ui-button ui-button--secondary ui-button--compact" id="importBtn" type="button">Import</button>
        <input id="importFile" class="ui-visually-hidden" type="file" accept="application/json" />
        <button class="ui-button ui-button--ghost ui-button--compact" id="optionsBtn" type="button">Settings</button>
      </section>

      <div class="ui-notice status" id="statusMsg" aria-live="polite"></div>

      <div class="ui-toast toast" id="undoToast" aria-live="polite">
        <span class="toast__text" id="undoText"></span>
        <button class="ui-toast__action" id="undoBtn" type="button">Undo</button>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
