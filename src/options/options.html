<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>@mapper Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1 id="app-title"><span class="title__trigger" id="app-trigger">@</span><span class="title__word" id="app-word">mapper</span> Settings</h1>
      <p>Create shortcuts once, then use them in any text field.</p>
    </header>

    <nav class="tab-bar" role="tablist" aria-label="Settings sections">
      <button type="button" class="tab active" id="tab-general" data-tab="general" role="tab" aria-controls="panel-general" aria-selected="true" tabindex="0">General</button>
      <button type="button" class="tab" id="tab-sites" data-tab="sites" role="tab" aria-controls="panel-sites" aria-selected="false" tabindex="-1">Sites <span class="count" id="sites-count">0</span></button>
      <button type="button" class="tab" id="tab-mappings" data-tab="mappings" role="tab" aria-controls="panel-mappings" aria-selected="false" tabindex="-1">Mappings <span class="count" id="mappings-count">0</span></button>
      <button type="button" class="tab" id="tab-data" data-tab="data" role="tab" aria-controls="panel-data" aria-selected="false" tabindex="-1">Data</button>
    </nav>

    <section class="tab-panel active" id="panel-general" data-panel="general" role="tabpanel" aria-labelledby="tab-general">
      <div class="setting-row">
        <label class="switch-label" for="global-enabled">
          <span class="setting-title">Enabled by default</span>
          <span class="setting-desc">Activate on all sites except those explicitly disabled.</span>
        </label>
        <label class="ui-switch">
          <input type="checkbox" id="global-enabled" />
          <span class="ui-switch__track" aria-hidden="true"></span>
        </label>
      </div>
      <div class="setting-row">
        <div class="ui-field text-field-inline">
          <label for="trigger-char">Trigger character</label>
          <input class="ui-input" type="text" id="trigger-char" maxlength="1" inputmode="text" autocomplete="off" aria-describedby="trigger-error" />
          <span class="ui-field__error" id="trigger-error">Enter a single non-whitespace character.</span>
        </div>
      </div>
      <div class="setting-row">
        <label class="switch-label" for="case-sensitive">
          <span class="setting-title">Case-sensitive matching</span>
          <span class="setting-desc">Match mapping keys exactly by case.</span>
        </label>
        <label class="ui-switch">
          <input type="checkbox" id="case-sensitive" />
          <span class="ui-switch__track" aria-hidden="true"></span>
        </label>
      </div>
      <div class="setting-row">
        <label class="switch-label" for="theme-select">
          <span class="setting-title">Appearance</span>
          <span class="setting-desc">Pick a light or dark look. On first run this follows your system.</span>
        </label>
        <div class="ui-select-field">
          <select id="theme-select" class="ui-select theme-select" aria-label="Appearance">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </div>
      <div class="save-status" id="save-status" aria-live="polite"></div>
    </section>

    <section class="tab-panel" id="panel-sites" data-panel="sites" role="tabpanel" aria-labelledby="tab-sites" hidden>
      <p class="section-desc">Sites below override the default. Add a hostname (e.g. <code>github.com</code>) and choose Enabled or Disabled.</p>
      <div class="add-row">
        <div class="ui-field grow">
          <label for="site-input">Hostname</label>
          <input class="ui-input" type="text" id="site-input" placeholder="example.com" autocomplete="off" />
        </div>
        <div class="ui-select-field">
          <label for="site-state">State</label>
          <select class="ui-select" id="site-state">
            <option value="enabled">Enabled</option>
            <option value="disabled">Disabled</option>
          </select>
        </div>
        <button type="button" class="ui-button ui-button--primary" id="add-site">Add</button>
      </div>
      <div class="ui-list" id="sites-list"></div>
    </section>

    <section class="tab-panel" id="panel-mappings" data-panel="mappings" role="tabpanel" aria-labelledby="tab-mappings" hidden>
      <div class="ui-field">
        <label for="mapping-search">Search mappings</label>
        <input class="ui-input" type="text" id="mapping-search" placeholder="Filter by key or value…" autocomplete="off" />
      </div>
      <div class="add-row">
        <div class="ui-field grow">
          <label for="mapping-key">Key</label>
          <input class="ui-input" type="text" id="mapping-key" placeholder="word" autocomplete="off" aria-describedby="mapping-key-error" />
          <span class="ui-field__error" id="mapping-key-error"></span>
        </div>
        <div class="arrow">→</div>
        <div class="ui-field grow">
          <label for="mapping-val">Replacement</label>
          <input class="ui-input" type="text" id="mapping-val" placeholder="replacement" autocomplete="off" />
        </div>
        <button type="button" class="ui-button ui-button--primary" id="add-mapping">Add</button>
      </div>
      <div class="ui-list" id="mappings-list"></div>
      <div class="ui-toast undo-toast" id="undo-toast" aria-live="polite"></div>
    </section>

    <section class="tab-panel" id="panel-data" data-panel="data" role="tabpanel" aria-labelledby="tab-data" hidden>
      <div class="data-row">
        <button type="button" class="ui-button ui-button--secondary" id="export-btn">Export to file</button>
      </div>
      <div class="import-box">
        <div class="file-row">
          <label class="file-input" for="import-file">
            <input type="file" id="import-file" accept=".json,application/json" />
            <span class="file-name" id="import-file-name">Choose file</span>
          </label>
          <div class="radio-group" id="import-mode">
            <label class="radio">
              <input type="radio" name="import-mode" value="merge" checked />
              <span>Merge</span>
            </label>
            <label class="radio">
              <input type="radio" name="import-mode" value="replace" />
              <span>Replace</span>
            </label>
          </div>
          <button type="button" class="ui-button ui-button--primary" id="import-btn">Import</button>
        </div>
        <div class="import-result" id="import-result" aria-live="polite"></div>
      </div>
    </section>

    <footer class="page-footer">
      <span id="version">Version </span>
      <span class="sep">·</span>
      <span>Fast text shortcuts, wherever you write.</span>
    </footer>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
