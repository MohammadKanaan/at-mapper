<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weekly update</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c2430;
        --muted: #66717f;
        --line: #e3e8ef;
        --paper: #ffffff;
        --canvas: #eef1f6;
        --accent: #1a56c4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--canvas); color: var(--ink); }
      .topbar {
        height: 56px; display: flex; align-items: center; gap: 12px;
        padding: 0 22px; background: var(--paper); border-bottom: 1px solid var(--line);
      }
      .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); }
      .brand { font-weight: 700; letter-spacing: -0.01em; }
      .crumb { color: var(--muted); font-size: 13px; }
      .topbar .spacer { flex: 1; }
      .avatar { width: 30px; height: 30px; border-radius: 50%; background: #cbd6e6; }
      .wrap { max-width: 760px; margin: 46px auto 0; padding: 0 24px; }
      .doc {
        background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
        padding: 34px 38px 40px; box-shadow: 0 18px 44px rgba(20, 32, 54, 0.08);
      }
      .doc h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; }
      .doc .meta { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
      textarea {
        width: 100%; min-height: 300px; resize: none; border: 0; outline: 0; padding: 0;
        color: var(--ink); font-size: 16px; line-height: 1.7; font-family: inherit; background: transparent;
      }
      textarea::placeholder { color: #9aa5b3; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="logo"></div>
      <div class="brand">Notes</div>
      <div class="crumb">/ Drafts / Weekly update</div>
      <div class="spacer"></div>
      <div class="avatar"></div>
    </header>
    <main class="wrap">
      <div class="doc">
        <h1>Weekly update</h1>
        <div class="meta">Edited just now</div>
        <textarea id="editor" spellcheck="false" placeholder="Write a reply…" aria-label="Note body"></textarea>
      </div>
    </main>
  </body>
</html>
