<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@mapper toolbar popup</title>
    <style>
      :root {
        --canvas: #e8ecf2;
        --surface: #ffffff;
        --ink: #131a22;
        --muted: #5a6673;
        --accent: #1a56c4;
        --accent-strong: #133f96;
        --accent-soft: #dfe8fb;
        --font-sans: "Avenir Next", Avenir, "Segoe UI Variable", "Segoe UI", Helvetica, sans-serif;
        --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }
      html,
      body { margin: 0; height: 100%; overflow: hidden; }
      body {
        width: 1280px;
        height: 800px;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 56px;
        padding: 0 84px;
      }
      .copy { width: 520px; flex: none; }
      .brand { display: flex; align-items: center; gap: 12px; margin: 0 0 34px; }
      .mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #ffffff;
        border-radius: 13px;
        font-size: 27px;
        font-weight: 750;
        line-height: 1;
      }
      .word { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; color: var(--accent-strong); }
      h1 { margin: 0; font-size: 45px; line-height: 1.04; letter-spacing: -0.04em; font-weight: 750; }
      .lede { margin: 22px 0 0; max-width: 430px; font-size: 19px; line-height: 1.5; color: var(--muted); }
      .visual {
        position: relative;
        flex: none;
        width: 512px;
        height: 668px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mat { position: absolute; inset: 0; background: var(--accent); border-radius: 30px; }
      .popup {
        position: relative;
        display: block;
        width: 424px;
        border-radius: 16px;
        box-shadow: 0 30px 60px rgba(18, 28, 45, 0.32);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="copy">
        <div class="brand">
          <span class="mark" aria-hidden="true">@</span>
          <span class="word">mapper</span>
        </div>
        <h1>Manage your shortcuts<br />on the go.</h1>
        <p class="lede">Add, edit, search, or delete a mapping. Turn @mapper on or off for the site you are on, and export or import when you switch browsers.</p>
      </div>
      <div class="visual">
        <div class="mat"></div>
        <img class="popup" src="/popup.png" alt="The @mapper popup listing saved shortcuts" />
      </div>
    </div>
  </body>
</html>
